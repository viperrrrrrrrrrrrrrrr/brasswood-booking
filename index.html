<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="description" content="Brasswood Barber Co. — classic cuts, sharp fades and hot-towel shaves. Book online with live availability." />
    <title>Brasswood Barber Co. — Book online</title>
    <script>
      // Hero photo: start the download before the JS bundle renders it (booking page only).
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'; l.as = 'image'; l.href = '/hero-1600.webp'
        l.setAttribute('imagesrcset', '/hero-800.webp 800w, /hero-1600.webp 1600w')
        l.setAttribute('imagesizes', '100vw')
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
